# A tag vX.Y.Z builds Claudio for x64 and ARM64, attests where each zip comes from, and publishes
# the release. Run by hand, it builds and attests without publishing anything.
name: Release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    name: Build (${{ matrix.rid }})
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - rid: win-x64
            platform: x64
          - rid: win-arm64
            platform: ARM64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Version
        id: version
        shell: pwsh
        run: |
          $version = if ('${{ github.ref_type }}' -eq 'tag') { '${{ github.ref_name }}'.TrimStart('v') } else { '0.0.0-dev' }
          "value=$version" >> $env:GITHUB_OUTPUT
      - name: Publish
        run: >
          dotnet publish src/Claudio.App/Claudio.App.csproj --configuration Release
          -p:Platform=${{ matrix.platform }} -r ${{ matrix.rid }}
          -p:Version=${{ steps.version.outputs.value }} -o dist/Claudio
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist/Claudio/* -DestinationPath "dist/Claudio-${{ steps.version.outputs.value }}-${{ matrix.rid }}.zip"
      - name: Attest provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*.zip
      - uses: actions/upload-artifact@v7
        with:
          name: Claudio-${{ matrix.rid }}
          path: dist/*.zip

  publish:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum *.zip > SHA256SUMS.txt
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --repo "${{ github.repository }}" --title "Claudio ${{ github.ref_name }}" --generate-notes
