# A new version on main (Directory.Build.props) or a tag vX.Y.Z builds Claudio for x64 and ARM64, packs each into an installer (Setup.exe: a
# shortcut on the desktop and in the Start menu, installed for the user without admin rights,
# updated in place), attests where every file comes from, and publishes the GitHub release that
# installed copies update from.
name: Release

on:
  push:
    branches: [main]
    paths: ['Directory.Build.props', '.github/workflows/release.yml']
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Version
        id: version
        shell: pwsh
        run: |
          if ('${{ github.ref_type }}' -eq 'tag') {
            $tag = '${{ github.ref_name }}'
          } else {
            $tag = 'v' + ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version
          }
          # A version already released is not built again.
          $released = git ls-remote --tags origin "refs/tags/$tag"
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "skip=$(if ($released -and '${{ github.ref_type }}' -ne 'tag') { 'true' } else { 'false' })" >> $env:GITHUB_OUTPUT
          "VERSION=$tag" >> $env:GITHUB_ENV
          Write-Host "Version $tag, already released: $([bool]$released)"
      - uses: actions/setup-dotnet@v6
        if: steps.version.outputs.skip != 'true'
        with:
          global-json-file: global.json
      - name: Velopack
        if: steps.version.outputs.skip != 'true'
        run: dotnet tool install -g vpk --version 1.2.161
      - name: Build and pack
        if: steps.version.outputs.skip != 'true'
        shell: pwsh
        run: |
          $version = $env:VERSION.TrimStart('v')
          foreach ($target in @(@{ Platform = 'x64'; Rid = 'win-x64' }, @{ Platform = 'ARM64'; Rid = 'win-arm64' })) {
            $publish = "publish/$($target.Rid)"
            dotnet publish src/Claudio.App/Claudio.App.csproj --configuration Release `
              -p:Platform=$($target.Platform) -r $($target.Rid) -p:Version=$version -o $publish
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            # The previous release lets Velopack build a small delta update.
            vpk download github --repoUrl "https://github.com/${{ github.repository }}" --token "${{ github.token }}" --channel $($target.Rid) --outputDir releases
            vpk pack --packId Claudio --packVersion $version --packDir $publish --mainExe Claudio.exe `
              --packTitle Claudio --packAuthors Endikk --icon src/Claudio.App/Assets/Claudio.ico `
              --channel $($target.Rid) --shortcuts Desktop,StartMenuRoot --outputDir releases
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Attest provenance
        if: steps.version.outputs.skip != 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            releases/*.exe
            releases/*.nupkg
      - name: Publish the release
        if: steps.version.outputs.skip != 'true'
        shell: pwsh
        run: |
          # A version with a suffix (v1.0.0-beta.1) is a pre-release: installed copies on the
          # stable line never update to it. The arguments are built as a list on purpose: a
          # one-item array would reach vpk as a string, then letter by letter.
          $first = $true
          foreach ($rid in 'win-x64', 'win-arm64') {
            $extra = [System.Collections.Generic.List[string]]::new()
            if ($env:VERSION.Contains('-')) { $extra.Add('--pre') }
            if (-not $first) { $extra.Add('--merge') }
            vpk upload github --repoUrl "https://github.com/${{ github.repository }}" --token "${{ github.token }}" `
              --channel $rid --outputDir releases --publish --releaseName "Claudio $env:VERSION" `
              --tag $env:VERSION --targetCommitish ${{ github.sha }} $extra.ToArray()
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $first = $false
          }
