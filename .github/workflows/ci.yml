# The logic and the shared fixtures run on Linux in seconds; the app itself builds on Windows,
# for both processors it ships for.
name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [develop, main]
    paths-ignore: ['**.md', 'docs/**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core and fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Format
        run: |
          dotnet format src/Claudio.Core/Claudio.Core.csproj --verify-no-changes
          dotnet format tests/Claudio.Core.Tests/Claudio.Core.Tests.csproj --verify-no-changes
      - name: Test
        run: dotnet test tests/Claudio.Core.Tests/Claudio.Core.Tests.csproj --configuration Release

  app:
    name: App (${{ matrix.platform }})
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64
            rid: win-x64
          - platform: ARM64
            rid: win-arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Build
        run: dotnet build src/Claudio.App/Claudio.App.csproj --configuration Release -p:Platform=${{ matrix.platform }} -r ${{ matrix.rid }}
