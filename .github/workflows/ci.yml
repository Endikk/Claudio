# The logic and the shared fixtures run on Linux in seconds; the app itself builds on Windows,
# for both processors it ships for.
name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [develop, main]
    paths-ignore: ['**.md', 'docs/**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core and fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Format
        run: |
          dotnet format src/Claudio.Core/Claudio.Core.csproj --verify-no-changes
          dotnet format tests/Claudio.Core.Tests/Claudio.Core.Tests.csproj --verify-no-changes
      - name: Test
        run: dotnet test tests/Claudio.Core.Tests/Claudio.Core.Tests.csproj --configuration Release

  app:
    name: App and installer (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # Each processor is built and started on a machine of its own kind.
        include:
          - platform: x64
            rid: win-x64
            runner: windows-latest
          - platform: ARM64
            rid: win-arm64
            runner: windows-11-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Publish
        run: dotnet publish src/Claudio.App/Claudio.App.csproj --configuration Release -p:Platform=${{ matrix.platform }} -r ${{ matrix.rid }} -o publish
      # Without its compiled XAML, Claudio crashes on launch before showing anything (1.0.0-beta.1).
      - name: Compiled XAML is shipped
        run: |
          if (-not (Test-Path publish/Claudio.pri)) { throw 'publish/Claudio.pri is missing: App.xaml cannot load.' }
      # The published folder is started for real, once per placement: what no unit test can see
      # (a missing file, a window that never draws) fails here, not on a user's PC.
      - name: Starts and shows its window
        shell: pwsh
        run: ./Scripts/smoke-test.ps1 -Folder publish -Report smoke
      - name: Keep the smoke test's logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-logs-${{ matrix.rid }}
          path: smoke
          if-no-files-found: ignore
      - name: Installer
        run: |
          dotnet tool install -g vpk --version 1.2.161
          vpk pack --packId Claudio --packVersion 1.0.0-ci.${{ github.run_number }} --packDir publish --mainExe Claudio.exe --packTitle Claudio --packAuthors Endikk --icon src/Claudio.App/Assets/Claudio.ico --channel ${{ matrix.rid }} --shortcuts Desktop,StartMenuRoot --outputDir releases
      - name: Keep the installer
        uses: actions/upload-artifact@v7
        with:
          name: Claudio-Setup-${{ matrix.rid }}
          path: releases/*Setup.exe
          if-no-files-found: error
